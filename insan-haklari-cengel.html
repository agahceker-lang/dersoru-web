<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hakların İzinde | Dersoru</title><meta name="description" content="20 ünitenin temel kavramlarını içeren kolay seviye insan hakları çengel bulmacası."><meta property="og:image" content="https://dersoru.com/haklarin-izinde-og.png">
<style>
:root{--ink:#16302b;--muted:#61736d;--paper:#f4f0e7;--cream:#fbf8f1;--coral:#f26b4b;--teal:#0d6b62;--mint:#bfe0d3;--line:#d9d2c4}*{box-sizing:border-box}html{background:var(--paper)}body{margin:0;color:var(--ink);background:radial-gradient(circle at 8% 10%,#fff7df 0 11rem,transparent 11.1rem),var(--paper);font-family:Arial,sans-serif}button,input{font:inherit}button{color:inherit}.topbar{max-width:1360px;margin:auto;padding:18px 28px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}.topbar a{text-decoration:none;font-weight:900;color:var(--teal)}.topbar .back{font-size:13px;color:var(--muted)}.hero{padding:52px max(24px,calc((100vw - 1280px)/2));border-bottom:1px solid var(--line);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:230px;height:230px;border:42px solid var(--mint);border-radius:50%;right:4vw;top:-118px;opacity:.6}.eyebrow{display:flex;gap:12px;color:#c9492f;font-weight:800;font-size:12px;letter-spacing:.15em}h1{margin:10px 0 8px;font:800 clamp(52px,8vw,108px)/.88 Georgia,serif;letter-spacing:-.06em}.subtitle{max-width:630px;color:var(--muted);font:18px/1.55 Georgia,serif}.progress-wrap{max-width:480px;margin-top:28px}.progress-meta{display:flex;justify-content:space-between;font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:800}.progress{margin-top:8px;height:8px;background:#ddd6c8;border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;background:var(--coral);transition:width .25s}.game{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,.7fr);max-width:1360px;margin:auto;border-inline:1px solid var(--line);background:var(--cream)}.board-panel{min-width:0;padding:34px;border-right:1px solid var(--line)}.current{min-height:118px;background:var(--ink);color:#fff;padding:20px 24px;margin-bottom:24px;box-shadow:7px 7px 0 var(--mint)}.current b,.current small{color:#a8d8c8;font-size:11px;letter-spacing:.12em;text-transform:uppercase}.current p{margin:8px 0;font:20px/1.35 Georgia,serif}.scroll{overflow-x:auto;padding:6px 0 16px}.board{width:640px;display:grid;grid-template-columns:repeat(20,32px);grid-template-rows:repeat(16,32px);background:var(--ink);border:3px solid var(--ink);box-shadow:10px 10px 0 #ded6c7}.block{background:var(--ink)}.cell{width:32px;height:32px;position:relative;background:#fff;border:1px solid #4d625c}.cell.active{background:#fff0bc}.cell.correct{background:#d7efe0}.cell.wrong{background:#ffd5c9;box-shadow:inset 0 0 0 2px var(--coral)}.cell input{width:100%;height:100%;border:0;outline:0;background:transparent;text-align:center;color:var(--ink);font-weight:900;font-size:17px;padding:5px 0 0}.cell:focus-within{z-index:2;box-shadow:inset 0 0 0 3px var(--coral)}.number{position:absolute;top:1px;left:2px;font-size:7px;font-weight:900;color:var(--teal);pointer-events:none}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.actions button{border:1px solid var(--ink);background:transparent;padding:12px 16px;font-weight:800;cursor:pointer}.actions .primary{background:var(--coral);border-color:var(--coral);color:#fff}.message{display:none;margin-top:18px;padding:15px 18px;font-weight:700;border-left:5px solid var(--coral);background:#fff0e8}.clues{padding:34px;background:#efe9dc}.clues-head{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--ink);padding-bottom:18px}.clues-head small{font-size:10px;letter-spacing:.18em;font-weight:900;color:#c9492f}.clues-head h2{margin:4px 0 0;font:700 27px/1.1 Georgia,serif}.count{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;background:var(--ink);color:#fff;font-weight:900}.group h3{margin:26px 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.15em}.clue{width:100%;display:grid;grid-template-columns:28px 1fr;gap:8px;border:0;border-top:1px solid #d4ccbd;padding:12px 8px;text-align:left;background:transparent;cursor:pointer}.clue:hover,.clue.selected{background:#fff}.clue>span{font:700 18px Georgia,serif;color:#c9492f}.clue p{margin:0;line-height:1.35;font-size:14px}.clue small{display:block;margin-top:5px;color:var(--muted);text-transform:uppercase;font-size:9px;letter-spacing:.1em;font-weight:800}footer{max-width:1360px;margin:auto;padding:28px 34px 50px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between}.footer-brand{font-weight:900;letter-spacing:.12em;color:var(--teal)}@media(max-width:980px){.game{grid-template-columns:1fr;border-inline:0}.board-panel{border-right:0;border-bottom:1px solid var(--line)}}@media(max-width:560px){.hero{padding:36px 20px}h1{font-size:56px}.board-panel,.clues{padding:22px 16px}.actions button{flex:1 1 45%}.actions .primary{flex-basis:100%}.topbar{padding-inline:20px}footer{flex-direction:column;gap:8px;padding-inline:20px}}
</style></head><body>
<nav class="topbar"><a href="/">Dersoru</a><a class="back" href="/">← Ana sayfaya dön</a></nav><header class="hero"><div class="eyebrow"><span>20 ÜNİTE</span><span>•</span><span>KOLAY SEVİYE</span></div><h1>Hakların İzinde</h1><p class="subtitle">İnsan haklarının temel kavramlarını bul, kesişen harflerle bütün resmi tamamla.</p><div class="progress-wrap"><div class="progress-meta"><span>İlerleme</span><strong id="percent">0%</strong></div><div class="progress"><span id="bar"></span></div></div></header>
<main class="game"><section class="board-panel"><div class="current"><b id="current-label"></b><p id="current-clue"></p><small id="current-unit"></small></div><div class="scroll"><div class="board" id="board" role="grid"></div></div><div class="actions"><button class="primary" id="check">Cevapları kontrol et</button><button id="hint">Bir harf aç</button><button id="clear">Temizle</button></div><div class="message" id="message"></div></section><aside class="clues"><div class="clues-head"><div><small>İPUÇLARI</small><h2>20 ünite, 20 kavram</h2></div><span class="count">20</span></div><div id="clue-list"></div></aside></main><footer><span class="footer-brand">DERSORU • İNSAN HAKLARI</span><span>Her kavram, daha adil bir dünya için bir anahtar.</span></footer>
<script>
const entries=[['BİRLEŞMİŞMİLLETLER',13,1,'across',20,'İnsan haklarını küresel düzeyde koruyan uluslararası örgüt.'],['AİHS',12,11,'down',18,"Avrupa İnsan Hakları Sözleşmesi'nin kısa adı."],['OMBUDSMAN',0,3,'across',17,'Kamu Denetçiliği Kurumu için kullanılan uluslararası ad.'],['NELİK',11,16,'down',2,'Bir varlığın ne olduğunu anlatan felsefi kavram.'],['AİHM',12,2,'down',19,"Avrupa İnsan Hakları Mahkemesi'nin kısa adı."],['NÜRNBERG',4,12,'down',10,'II. Dünya Savaşı sonrasında savaş suçlarının yargılandığı şehir.'],['KATILIM',7,7,'down',16,'Bireyin yönetime ve kamusal kararlara dahil olması.'],['İNSAN',7,11,'across',1,'İnsan haklarının merkezindeki, değer sahibi varlık.'],['EVRENSELLİK',9,9,'across',11,'Hakların ayrım gözetmeden herkese ait olması ilkesi.'],['DEMOKRASİ',15,0,'across',8,'Halkın kamusal kararların oluşumuna katıldığı yönetim anlayışı.'],['ÖZGÜRLÜK',7,0,'across',12,'Bireyin seçim yapabilme ve davranabilme alanı.'],['HUKUK',15,14,'across',7,'Devlet gücünü kurallara bağlayan ve sınırlayan düzen.'],['KİŞİ',11,9,'down',3,'Hukuk düzeninde hak ve borçların öznesi.'],['GÜVENCE',11,12,'across',4,'Bir hakkı müdahale ve ihlallere karşı koruyan araç.'],['LAİKLİK',11,3,'across',6,'Devletin din ve inançlar karşısındaki tarafsızlığı.'],['ANAYASA',4,0,'across',15,'Temel hakları en üst düzeyde güvenceye alan hukuk metni.'],['MAGNACARTA',0,4,'down',9,"1215'te kralın yetkilerini sınırlayan tarihî belge."],['VAZGEÇİLMEZLİK',2,1,'across',13,'İnsan haklarının kişiden koparılamamasını anlatan özellik.'],['ADALET',9,2,'across',5,'Haklı olana hakkını verme düşüncesi.'],['ÖLÇÜLÜLÜK',5,9,'across',14,'Hak sınırlamasında aracın amaçla dengeli olmasını isteyen ilke.']].map(([answer,row,col,direction,unit,clue])=>({answer,row,col,direction,unit,clue}));
const cells=new Map(),starts=new Map(),values={};let active=0,checked=false;entries.forEach((e,ei)=>[...e.answer].forEach((letter,i)=>{const r=e.row+(e.direction==='down'?i:0),c=e.col+(e.direction==='across'?i:0),k=`${r}-${c}`,cell=cells.get(k)||{letter,entries:[]};cell.entries.push(ei);cells.set(k,cell)}));[...new Set(entries.map(e=>`${e.row}-${e.col}`))].sort((a,b)=>{const A=a.split('-').map(Number),B=b.split('-').map(Number);return A[0]-B[0]||A[1]-B[1]}).forEach((k,i)=>starts.set(k,i+1));const keysFor=e=>[...e.answer].map((_,i)=>`${e.row+(e.direction==='down'?i:0)}-${e.col+(e.direction==='across'?i:0)}`);const norm=v=>v.toLocaleUpperCase('tr-TR').replace(/[^A-ZÇĞİÖŞÜ]/g,'');
function select(i,focus=true){active=i;document.querySelectorAll('.clue').forEach(b=>b.classList.toggle('selected',+b.dataset.i===i));paint();if(focus){const ks=keysFor(entries[i]),k=ks.find(x=>!values[x])||ks[0];setTimeout(()=>document.querySelector(`[data-key="${k}"] input`)?.focus())}}function paint(){const e=entries[active],activeKeys=new Set(keysFor(e));document.querySelectorAll('.cell').forEach(el=>{const k=el.dataset.key,cell=cells.get(k),v=values[k]||'';el.classList.toggle('active',activeKeys.has(k));el.classList.toggle('correct',checked&&v===cell.letter);el.classList.toggle('wrong',checked&&v&&v!==cell.letter)});document.getElementById('current-label').textContent=`${starts.get(`${e.row}-${e.col}`)} · ${e.direction==='across'?'Yatay':'Dikey'}`;document.getElementById('current-clue').textContent=e.clue;document.getElementById('current-unit').textContent=`Ünite ${e.unit} · Türkçe karakter kullanmadan yaz`;const done=[...cells].filter(([k,c])=>values[k]===c.letter).length,p=Math.round(done/cells.size*100);percent.textContent=p+'%';bar.style.width=p+'%'}
const board=document.getElementById('board');for(let i=0;i<320;i++){const r=Math.floor(i/20),c=i%20,k=`${r}-${c}`,cell=cells.get(k);if(!cell){const x=document.createElement('span');x.className='block';board.append(x);continue}const label=document.createElement('label');label.className='cell';label.dataset.key=k;if(starts.has(k)){const n=document.createElement('span');n.className='number';n.textContent=starts.get(k);label.append(n)}const input=document.createElement('input');input.maxLength=1;input.autocomplete='off';input.onfocus=()=>{if(!cell.entries.includes(active))select(cell.entries[0],false)};input.onclick=()=>{if(cell.entries.length>1&&cell.entries.includes(active))select(cell.entries.find(x=>x!==active),false)};input.oninput=ev=>{const v=norm(ev.target.value).slice(-1);ev.target.value=v;values[k]=v;checked=false;paint();if(v){const ks=keysFor(entries[active]),next=ks[ks.indexOf(k)+1];if(next)document.querySelector(`[data-key="${next}"] input`)?.focus()}};label.append(input);board.append(label)}const list=document.getElementById('clue-list');['across','down'].forEach(dir=>{const group=document.createElement('div');group.className='group';group.innerHTML=`<h3>${dir==='across'?'Yatay':'Dikey'}</h3>`;entries.forEach((e,i)=>{if(e.direction!==dir)return;const b=document.createElement('button');b.className='clue';b.dataset.i=i;b.innerHTML=`<span>${starts.get(`${e.row}-${e.col}`)}</span><p>${e.clue}<small>Ünite ${e.unit}</small></p>`;b.onclick=()=>select(i);group.append(b)});list.append(group)});
check.onclick=()=>{checked=true;paint();const m=message,p=percent.textContent;m.style.display='block';m.textContent=p==='100%'?'Tebrikler! İnsan hakları yolculuğunu tamamladın.':'Turuncu kutuları yeniden düşün. Doğru harfler yeşille işaretlendi.'};hint.onclick=()=>{const k=keysFor(entries[active]).find(x=>values[x]!==cells.get(x).letter);if(!k)return;values[k]=cells.get(k).letter;const input=document.querySelector(`[data-key="${k}"] input`);input.value=values[k];checked=false;paint();input.focus()};clear.onclick=()=>{Object.keys(values).forEach(k=>delete values[k]);document.querySelectorAll('.cell input').forEach(i=>i.value='');checked=false;message.style.display='none';paint()};select(0,false);
</script></body></html>
