<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anayasa Hukuku Bulmacası | Dersoru</title><meta name="description" content="Anayasa hukuku temel kavramlarını içeren kolay seviye çengel bulmacası."><meta property="og:image" content="https://dersoru.com/haklarin-izinde-og.png">
<style>
:root{--ink:#16302b;--muted:#61736d;--paper:#f4f0e7;--cream:#fbf8f1;--coral:#f26b4b;--teal:#0d6b62;--mint:#bfe0d3;--line:#d9d2c4}*{box-sizing:border-box}html{background:var(--paper)}body{margin:0;color:var(--ink);background:radial-gradient(circle at 8% 10%,#fff7df 0 11rem,transparent 11.1rem),var(--paper);font-family:Arial,sans-serif}button,input{font:inherit}button{color:inherit}.topbar{max-width:1360px;margin:auto;padding:18px 28px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}.topbar a{text-decoration:none;font-weight:900;color:var(--teal)}.topbar .back{font-size:13px;color:var(--muted)}.hero{padding:52px max(24px,calc((100vw - 1280px)/2));border-bottom:1px solid var(--line);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:230px;height:230px;border:42px solid var(--mint);border-radius:50%;right:4vw;top:-118px;opacity:.6}.eyebrow{display:flex;gap:12px;color:#c9492f;font-weight:800;font-size:12px;letter-spacing:.15em}h1{margin:10px 0 8px;font:800 clamp(52px,8vw,108px)/.88 Georgia,serif;letter-spacing:-.06em}.subtitle{max-width:630px;color:var(--muted);font:18px/1.55 Georgia,serif}.progress-wrap{max-width:480px;margin-top:28px}.progress-meta{display:flex;justify-content:space-between;font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:800}.progress{margin-top:8px;height:8px;background:#ddd6c8;border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;background:var(--coral);transition:width .25s}.game{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,.7fr);max-width:1360px;margin:auto;border-inline:1px solid var(--line);background:var(--cream)}.board-panel{min-width:0;padding:34px;border-right:1px solid var(--line)}.current{min-height:118px;background:var(--ink);color:#fff;padding:20px 24px;margin-bottom:24px;box-shadow:7px 7px 0 var(--mint)}.current b,.current small{color:#a8d8c8;font-size:11px;letter-spacing:.12em;text-transform:uppercase}.current p{margin:8px 0;font:20px/1.35 Georgia,serif}.scroll{overflow-x:auto;padding:6px 0 16px}.board{width:864px;display:grid;grid-template-columns:repeat(27,32px);grid-template-rows:repeat(18,32px);background:var(--ink);border:3px solid var(--ink);box-shadow:10px 10px 0 #ded6c7}.block{background:var(--ink)}.cell{width:32px;height:32px;position:relative;background:#fff;border:1px solid #4d625c}.cell.active{background:#fff0bc}.cell.correct{background:#d7efe0}.cell.wrong{background:#ffd5c9;box-shadow:inset 0 0 0 2px var(--coral)}.cell input{width:100%;height:100%;border:0;outline:0;background:transparent;text-align:center;color:var(--ink);font-weight:900;font-size:17px;padding:5px 0 0}.cell:focus-within{z-index:2;box-shadow:inset 0 0 0 3px var(--coral)}.number{position:absolute;top:1px;left:2px;font-size:7px;font-weight:900;color:var(--teal);pointer-events:none}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.actions button{border:1px solid var(--ink);background:transparent;padding:12px 16px;font-weight:800;cursor:pointer}.actions .primary{background:var(--coral);border-color:var(--coral);color:#fff}.actions button:disabled{opacity:.45;cursor:not-allowed}.message{display:none;margin-top:18px;padding:15px 18px;font-weight:700;border-left:5px solid var(--coral);background:#fff0e8}.clues{padding:34px;background:#efe9dc}.clues-head{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--ink);padding-bottom:18px}.clues-head small{font-size:10px;letter-spacing:.18em;font-weight:900;color:#c9492f}.clues-head h2{margin:4px 0 0;font:700 27px/1.1 Georgia,serif}.count{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;background:var(--ink);color:#fff;font-weight:900}.group h3{margin:26px 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.15em}.clue{width:100%;display:grid;grid-template-columns:28px 1fr;gap:8px;border:0;border-top:1px solid #d4ccbd;padding:12px 8px;text-align:left;background:transparent;cursor:pointer}.clue:hover,.clue.selected{background:#fff}.clue>span{font:700 18px Georgia,serif;color:#c9492f}.clue p{margin:0;line-height:1.35;font-size:14px}.clue small{display:block;margin-top:5px;color:var(--muted);text-transform:uppercase;font-size:9px;letter-spacing:.1em;font-weight:800}footer{max-width:1360px;margin:auto;padding:28px 34px 50px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between}.footer-brand{font-weight:900;letter-spacing:.12em;color:var(--teal)}@media(max-width:980px){.game{grid-template-columns:1fr;border-inline:0}.board-panel{border-right:0;border-bottom:1px solid var(--line)}}@media(max-width:560px){.hero{padding:36px 20px}h1{font-size:56px}.board-panel,.clues{padding:22px 16px}.actions button{flex:1 1 45%}.actions .primary{flex-basis:100%}.topbar{padding-inline:20px}footer{flex-direction:column;gap:8px;padding-inline:20px}}
</style></head><body>
<nav class="topbar"><a href="/">Dersoru</a><a class="back" href="/bulmacalar.html">← Bulmacalara dön</a></nav><header class="hero"><div class="eyebrow"><span>ÇENGEL BULMACA</span><span>•</span><span>KOLAY SEVİYE</span></div><h1>Anayasa Hukuku</h1><p class="subtitle">Anayasa hukukunun temel kavramlarını bul, kesişen harflerle bilgini tamamla.</p><div class="progress-wrap"><div class="progress-meta"><span>İlerleme</span><strong id="percent">0%</strong></div><div class="progress"><span id="bar"></span></div></div></header>
<main class="game"><section class="board-panel"><div class="current"><b id="current-label"></b><p id="current-clue"></p><small id="current-unit"></small></div><div class="scroll"><div class="board" id="board" role="grid"></div></div><div class="actions"><button class="primary" id="check">Cevapları kontrol et</button><button id="hint">Bir harf aç (<span id="hint-count">10</span>)</button><button id="clear">Temizle</button></div><div class="message" id="message"></div></section><aside class="clues"><div class="clues-head"><div><small>İPUÇLARI</small><h2>Anayasa Hukuku</h2></div><span class="count">27</span></div><div id="clue-list"></div></aside></main><footer><span class="footer-brand">DERSORU • ANAYASA HUKUKU</span><span>Her kavram, daha adil bir dünya için bir anahtar.</span></footer>
<script>
const entries=[
['KAYNAK',14,7,'across',1,'Anayasa hukukunda kuralların doğduğu veya bulunduğu yer.'],
['NORM',14,10,'down',2,'Uyulması gereken hukuk kuralı.'],
['ANAYASACILIK',4,10,'across',3,'Devlet iktidarını hukukla sınırlandırma düşüncesi.'],
['REFERANDUM',2,4,'down',4,'Bir anayasa değişikliğinin halkın oyuna sunulması.'],
['ÜSTÜNLÜK',9,23,'down',5,'Anayasanın diğer hukuk kurallarından daha üstte olması ilkesi.'],
['EGEMENLİK',6,19,'down',6,'Devletin ülke üzerindeki en üstün kamu gücü.'],
['KUVVETLER',4,21,'down',7,'Yasama, yürütme ve yargı için kullanılan ortak ifade.'],
['DEMOKRASİ',6,26,'down',8,'Siyasal iktidarın kaynağını halka bağlayan yönetim anlayışı.'],
['SEÇİM',4,15,'down',9,'Halkın yöneticilerini oyla belirlediği demokratik yöntem.'],
['PARTİ',6,2,'down',10,'Siyasal iktidara demokratik yollarla katılmayı amaçlayan örgüt.'],
['BAŞKANLIK',6,17,'down',11,'Yürütmenin halk tarafından seçilen başkana ait olduğu hükûmet sistemi.'],
['YASAMA',0,7,'down',12,'Genel ve soyut hukuk kuralları koyan devlet işlevi.'],
['HUKUKDEVLETİ',14,15,'across',13,'Devletin de hukuk kurallarıyla bağlı olduğu ilke.'],
['TEMELHAK',3,1,'across',14,'Anayasa tarafından güvence altına alınan önemli hak.'],
['MEŞVERET',8,15,'across',15,'Osmanlı yönetim geleneğinde danışma anlamına gelen kavram.'],
['TANZİMAT',6,0,'down',16,'1839 yılında ilan edilen ve hukukileşmeyi güçlendiren ferman.'],
['KANUNİESASİ',2,9,'across',17,'1876 tarihli ilk Osmanlı anayasası.'],
['MİLLİEGEMENLİK',1,19,'down',18,'Egemenliğin millete ait olduğunu belirten ilke.'],
['ANAYASAMAHKEMESİ',7,0,'across',19,'Kanunların Anayasaya uygunluğunu denetleyen yüksek mahkeme.'],
['CUMHURİYET',0,0,'across',20,'Devlet başkanlığının veraset yoluyla geçmediği yönetim biçimi.'],
['ÖZGÜRLÜK',9,6,'across',21,'Kişinin anayasal sınırlar içinde serbestçe davranabilmesi.'],
['SOSYALHAK',12,7,'across',22,'Çalışma, sağlık ve sosyal güvenlik gibi hakların ortak adı.'],
['ÜYELİK',9,12,'down',23,'Bir siyasi partiye katılma durumunu anlatan kavram.'],
['TBMM',13,0,'across',24,'Türkiye’nin yasama organının kısa adı.'],
['CUMHURBAŞKANI',16,14,'across',25,'1982 Anayasası düzeninde yürütme yetkisini kullanan makam.'],
['YARGI',6,8,'down',26,'Hukuki uyuşmazlıkları bağımsız mahkemelerle çözen devlet işlevi.'],
['İKİTUR',10,0,'across',27,'Cumhurbaşkanı seçiminde gerekirse uygulanan oylama biçimi.']
].map(([answer,row,col,direction,unit,clue])=>({answer,row,col,direction,unit,clue}));
const cells=new Map(),starts=new Map(),values={};let active=0,checked=false,hints=Math.max(0,Math.min(10,Number(localStorage.getItem('dersoru-anayasa-hukuku-hints')??10)));entries.forEach((e,ei)=>[...e.answer].forEach((letter,i)=>{const r=e.row+(e.direction==='down'?i:0),c=e.col+(e.direction==='across'?i:0),k=`${r}-${c}`,cell=cells.get(k)||{letter,entries:[]};cell.entries.push(ei);cells.set(k,cell)}));[...new Set(entries.map(e=>`${e.row}-${e.col}`))].sort((a,b)=>{const A=a.split('-').map(Number),B=b.split('-').map(Number);return A[0]-B[0]||A[1]-B[1]}).forEach((k,i)=>starts.set(k,i+1));const keysFor=e=>[...e.answer].map((_,i)=>`${e.row+(e.direction==='down'?i:0)}-${e.col+(e.direction==='across'?i:0)}`);const norm=v=>v.toLocaleUpperCase('tr-TR').replace(/[^A-ZÇĞİÖŞÜ]/g,'');
function select(i,focus=true){active=i;document.querySelectorAll('.clue').forEach(b=>b.classList.toggle('selected',+b.dataset.i===i));paint();if(focus){const ks=keysFor(entries[i]),k=ks.find(x=>!values[x])||ks[0];setTimeout(()=>document.querySelector(`[data-key="${k}"] input`)?.focus())}}function paint(){const e=entries[active],activeKeys=new Set(keysFor(e));document.querySelectorAll('.cell').forEach(el=>{const k=el.dataset.key,cell=cells.get(k),v=values[k]||'';el.classList.toggle('active',activeKeys.has(k));el.classList.toggle('correct',checked&&v===cell.letter);el.classList.toggle('wrong',checked&&v&&v!==cell.letter)});document.getElementById('current-label').textContent=`${starts.get(`${e.row}-${e.col}`)} · ${e.direction==='across'?'Yatay':'Dikey'}`;document.getElementById('current-clue').textContent=e.clue;document.getElementById('current-unit').textContent=`Ünite ${e.unit} · Türkçe karakter kullanmadan yaz`;const done=[...cells].filter(([k,c])=>values[k]===c.letter).length,p=Math.round(done/cells.size*100);percent.textContent=p+'%';bar.style.width=p+'%'}
const board=document.getElementById('board');for(let i=0;i<486;i++){const r=Math.floor(i/27),c=i%27,k=`${r}-${c}`,cell=cells.get(k);if(!cell){const x=document.createElement('span');x.className='block';board.append(x);continue}const label=document.createElement('label');label.className='cell';label.dataset.key=k;if(starts.has(k)){const n=document.createElement('span');n.className='number';n.textContent=starts.get(k);label.append(n)}const input=document.createElement('input');input.maxLength=1;input.autocomplete='off';input.onfocus=()=>{if(!cell.entries.includes(active))select(cell.entries[0],false)};input.onclick=()=>{if(cell.entries.length>1&&cell.entries.includes(active))select(cell.entries.find(x=>x!==active),false)};input.oninput=ev=>{const v=norm(ev.target.value).slice(-1);ev.target.value=v;values[k]=v;checked=false;paint();if(v){const ks=keysFor(entries[active]),next=ks[ks.indexOf(k)+1];if(next)document.querySelector(`[data-key="${next}"] input`)?.focus()}};label.append(input);board.append(label)}const list=document.getElementById('clue-list');['across','down'].forEach(dir=>{const group=document.createElement('div');group.className='group';group.innerHTML=`<h3>${dir==='across'?'Yatay':'Dikey'}</h3>`;entries.forEach((e,i)=>{if(e.direction!==dir)return;const b=document.createElement('button');b.className='clue';b.dataset.i=i;b.innerHTML=`<span>${starts.get(`${e.row}-${e.col}`)}</span><p>${e.clue}<small>Ünite ${e.unit}</small></p>`;b.onclick=()=>select(i);group.append(b)});list.append(group)});
check.onclick=()=>{checked=true;paint();const m=message,p=percent.textContent;m.style.display='block';m.textContent=p==='100%'?'Tebrikler! İnsan hakları yolculuğunu tamamladın.':'Turuncu kutuları yeniden düşün. Doğru harfler yeşille işaretlendi.'};hint.onclick=()=>{if(hints<=0)return;const k=keysFor(entries[active]).find(x=>values[x]!==cells.get(x).letter);if(!k)return;hints--;localStorage.setItem('dersoru-anayasa-hukuku-hints',hints);document.getElementById('hint-count').textContent=hints;hint.disabled=hints===0;values[k]=cells.get(k).letter;const input=document.querySelector(`[data-key="${k}"] input`);input.value=values[k];checked=false;paint();input.focus()};document.getElementById('hint-count').textContent=hints;hint.disabled=hints===0;clear.onclick=()=>{Object.keys(values).forEach(k=>delete values[k]);document.querySelectorAll('.cell input').forEach(i=>i.value='');checked=false;message.style.display='none';paint()};select(0,false);
</script></body></html>
